<!DOCTYPE html>
<html lang="es">
<head th:replace="~{presentation/fragmentPublic :: head}"></head>
<body>

<section class="Inicio">
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <p>
                <img src="https://cdn-icons-png.flaticon.com/512/86/86155.png"
                     alt="icono"
                     style="width:50px;height:50px;filter: brightness(0) invert(1);">
                <strong> Bolsa de Empleo</strong>
            </p>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link" th:href="@{/}">Inicio</a>
            </div>
        </div>
    </nav>
</section>


<div class="contenedor-filtros">
    <h4>Buscar puestos por características</h4>

    <!--
        PUNTO 1:
        - th:action apunta al endpoint correcto
        - method="get" para que los params vayan en la URL
        - Todos los checkboxes usan name="habilidades"
        - El value debe ser el ID real de la característica en la BD
    -->
    <form th:action="@{/buscaPuesto}" method="get">

        <div class="seccion-scroll">

            <div class="grupo-categoria">
                <div class="categoria-padre">
                    <input type="checkbox" id="motores" name="habilidades" value="CAR-MOTORES">
                    <label for="motores">Motores de BD</label>
                </div>
                <div class="sub-opciones">
                    <div class="item">
                        <input type="checkbox" id="mysql" name="habilidades" value="CAR-MYSQL">
                        <label for="mysql">MySQL</label>
                    </div>
                    <div class="item">
                        <input type="checkbox" id="oracle" name="habilidades" value="CAR-ORACLE">
                        <label for="oracle">Oracle</label>
                    </div>
                </div>
            </div>

            <div class="grupo-categoria">
                <div class="categoria-padre">
                    <input type="checkbox" id="ciber" name="habilidades" value="CAR-CIBER">
                    <label for="ciber">Ciberseguridad</label>
                </div>
            </div>

            <div class="grupo-categoria">
                <div class="categoria-padre">
                    <input type="checkbox" id="lenguajes" name="habilidades" value="CAR-LENGUAJES">
                    <label for="lenguajes">Lenguajes de Programación</label>
                </div>
                <div class="sub-opciones">
                    <div class="item">
                        <input type="checkbox" id="csharp" name="habilidades" value="CAR-CSHARP">
                        <label for="csharp">C#</label>
                    </div>
                    <div class="item">
                        <input type="checkbox" id="java" name="habilidades" value="CAR-JAVA">
                        <label for="java">Java</label>
                    </div>
                    <div class="item">
                        <input type="checkbox" id="kotlin" name="habilidades" value="CAR-KOTLIN">
                        <label for="kotlin">Kotlin</label>
                    </div>
                </div>
            </div>

            <div class="grupo-categoria">
                <div class="categoria-padre">
                    <input type="checkbox" id="datab" name="habilidades" value="CAR-DATABASES">
                    <label for="datab">Bases de Datos</label>
                </div>
                <div class="sub-opciones">
                    <div class="item">
                        <input type="checkbox" id="modelado" name="habilidades" value="CAR-MODELADO">
                        <label for="modelado">Modelado</label>
                    </div>
                </div>
            </div>

            <div class="grupo-categoria">
                <div class="categoria-padre">
                    <input type="checkbox" id="web" name="habilidades" value="CAR-WEB">
                    <label for="web">Tecnologías Web</label>
                </div>
            </div>

            <div class="grupo-categoria">
                <div class="categoria-padre">
                    <input type="checkbox" id="testing" name="habilidades" value="CAR-TESTING">
                    <label for="testing">Testing</label>
                </div>
                <div class="sub-opciones">
                    <div class="item">
                        <input type="checkbox" id="junit" name="habilidades" value="CAR-JUNIT">
                        <label for="junit">JUnit</label>
                    </div>
                    <div class="item">
                        <input type="checkbox" id="assertions" name="habilidades" value="CAR-ASSERTIONS">
                        <label for="assertions">Assertions</label>
                    </div>
                </div>
            </div>

            <div class="seccion-botones">
                <button type="submit" class="btn-azul">Buscar</button>
                <button type="reset" class="btn-blanco">Limpiar</button>
            </div>

        </div>
    </form>
</div>


<!--
    PUNTO 1: Mostrar resultados
    - th:if para manejar lista vacía vs con resultados
    - Mismo patrón de card que viewpublic.html para consistencia
-->
<div class="MostrarPuestos">

    <!-- Mensaje cuando no se ha buscado aún o no hay resultados -->
    <p th:if="${puestos == null or #lists.isEmpty(puestos)}"
       style="text-align:center; padding: 2rem; color: #666;">
        No se encontraron puestos con las características seleccionadas.
    </p>

    <!-- Grid de puestos cuando sí hay resultados -->
    <div class="grid-puestos" th:if="${puestos != null and not #lists.isEmpty(puestos)}">
        <div class="card-puesto" th:each="p : ${puestos}">

            <h3 style="font-weight: bold;" th:text="${p.empresa != null ? p.empresa.nombre : 'Empresa'}"></h3>
            <p class="titulo" th:text="${p.descripcion}"></p>
            <p class="salario" th:text="'₡ ' + ${p.salario}"></p>

            <button class="btn-detalle">Ver detalle</button>

            <!-- Detalle oculto -->
            <div class="detalle">
                <p><strong>Tipo:</strong> <span th:text="${p.tipo}"></span></p>
                <p><strong>Estado:</strong> <span th:text="${p.estado}"></span></p>
                <p><strong>Fecha:</strong> <span th:text="${p.fecha}"></span></p>
            </div>

        </div>
    </div>

</div>


<footer th:replace="~{presentation/fragmentPublic :: footer}"></footer>

</body>
</html>

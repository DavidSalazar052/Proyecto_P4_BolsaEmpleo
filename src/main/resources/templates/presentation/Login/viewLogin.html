<!DOCTYPE html>
<html lang="en">
<head th:replace="~{presentation/fragmentPublic :: head}"></head>

    <body>
    <section class="Inicio">
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container">
                <p>
                    <img src="https://cdn-icons-png.flaticon.com/512/86/86155.png"
                         alt="icono"
                         style="width:50px;height:50px;filter: brightness(0) invert(1);">
                    <strong> Bolsa de Empleo</strong>
                </p>
                <div class="navbar-nav ms-auto align-items-center">
                    <!--Aqui llama al RootRedirectController -->
                    <a class="nav-link" th:href="@{/}">Inicio</a>
                </div>
            </div>
        </nav>

        <div class="container hero-content text-center">
            <p class="hero-eyebrow">Accedé a tu cuenta</p>
            <h1 class="hero-title">Iniciar sesión</h1>
        </div>
    </section>
    <section class="container login-rapida">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">

                    <h5 class="mb-3 fw-bold text-center">Ingresá tus datos</h5>

                    <!-- Mensaje de error — solo aparece si hay error -->
                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>

                    <form method="POST" th:action="@{/login}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Usuario
                            </label>
                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   placeholder="empresa-oferente"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Contraseña</label>
                            <input type="password"
                                   name="clave"
                                   class="form-control"
                                   placeholder="••••••••"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100 mt-2">
                            Entrar
                        </button>

                    </form>

                    <hr>

                    <div class="text-center small">
                        <!--AQUI DEBEMOS COLOCAR LOS LINKS A LOS REGISTROS DE AMBOS-->
                        <a th:href="@{/registro/empresa}">Registrar empresa</a>
                        &nbsp;|&nbsp;
                        <a th:href="@{/registro/oferente}">Registrar oferente</a>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{presentation/fragmentPublic :: footer}"></footer>
    </body>
</html>

  <!--Buscar por Categoria -->


<h3>Buscar puestos por características</h3>

<form action="#" method="get">
    <div class="contenedor">




        <div class="categoria">
            <input type="checkbox" id="Motores" name="motor" value="mysql" style="float: left">
            <label for="Motores">Motores</label><br>
            <input type="checkbox" id="mysql" name="motor" value="mysql" style="float: left">
            <label for="mysql">MySQL</label><br>

            <input type="checkbox" id="oracle" name="motor" value="oracle">
            <label for="oracle">Oracle</label>
        </div>




        <div class="categoria">
            <input type="checkbox" id="lenprogra" name="lenguaje" value="lenguajes de programacion" style="float: left">
            <label for="lenprogra" >Lenguajes de Programación</label><br>
            <input type="checkbox" id="csharp" name="lenguaje" value="csharp" style="float: left">
            <label for="csharp" >C#</label><br>

            <input type="checkbox" id="java" name="lenguaje" value="java" style="float: left">
            <label for="java">Java</label><br>

            <input type="checkbox" id="kotlin" name="lenguaje" value="kotlin" style="float: left">
            <label for="kotlin">Kotlin</label>
        </div>
        <br>




        <div class="categoria">

            <input type="checkbox" id="web" name="tecnologia" value="web" style="float: left">
            <label for="web">Tecnologías Web</label>

        </div>


        <button type="submit">Buscar</button>
        <button type="reset">Limpiar</button>

    </div>
</form>
